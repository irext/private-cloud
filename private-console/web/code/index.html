<!DOCTYPE html>
<html lang="zh-cmn">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="portrait">
    <meta name="description" content="irext application">
    <meta name="author" content="strawmanbobi">
    <title data-i18n="page_code.title">控制台</title>

    <link rel="stylesheet" href="../public/bower_components/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../public/bower_components/toastr/toastr.min.css">
    <link rel="stylesheet" href="../public/bower_components/select2/dist/css/select2.min.css">
    <link rel="stylesheet" href="../public/bower_components/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="../public/bower_components/bootstrap-table/dist/bootstrap-table.min.css">
    <link rel="stylesheet" href="../public/bower_components/bootstrap-multiselect/dist/css/bootstrap-multiselect.css">
    <link rel="stylesheet" href="./css/code_index.css">

    <link href="../images/ir_logo_favicon.png" rel="shortcut icon" type="image/png">
</head>
<body class="page_code">
    <div class="navbar container">
        <div class="header clearfix">
            <nav>
                <ul class="nav nav-pills pull-right">
                    <li role="presentation"><a href="#" data-i18n="page_code.d_try_index_quit" onclick="gotoIndex();">退出</a></li>
                </ul>
            </nav>
            <h3 data-i18n="page_code.title">控制台</h3>
        </div>
    </div>
    <div class="container">
        <div class="starter-template" style="padding: 0;">
            <div class="row">
                <div class="col-lg-6">
                    <div class="input-group" style="max-height: 25px;">
                        <span class="input-group-addon" data-i18n="page_code.panel_category">类型</span>
                        <select id="filter_category_id" name="filter_category_id" class="input-group-addon" onchange="onFilterCategoryChange();" style="width: 100%;">
                        </select>
                    </div>
                    <br>
                    <div class="input-group" id="filter_brand_panel" style="max-height: 25px;">
                        <span class="input-group-addon" data-i18n="page_code.panel_brand">品牌</span>
                        <select id="filter_brand_id" name="filter_brand_id" class="input-group-addon" onchange="onFilterBrandChange();" style="width: 100%;">
                        </select>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="input-group" id="filter_province_panel" style="max-height: 25px; display: none;">
                        <span class="input-group-addon" data-i18n="page_code.panel_select_province">选择省份</span>
                        <select id="filter_province_id" name="filter_province_id" onchange="onFilterProvinceChange();" style="width: 100%;">
                        </select>
                        <!-- <span class="input-group-addon pointer">+</span> -->
                    </div>
                    <br>
                    <div class="input-group" id="filter_city_panel" style="max-height: 25px; display: none;">
                        <span class="input-group-addon" data-i18n="page_code.panel_select_city">选择城市</span>
                        <select id="filter_city_code" name="filter_city_code" onchange="onFilterCityChange();" style="width: 100%;">
                        </select>
                        <!-- <span class="input-group-addon pointer">+</span> -->
                    </div>
                </div>
            </div>
            <hr>
            <div>
                <div class="btn-group" role="group" aria-label="...">
                    <button class="btn btn-normal btn-default" onclick="loadRemoteList();" style="font-size: 14px; margin-right: 2px;">
                        <i class="fa-solid fa-refresh"></i>
                    </button>
                    <button id="search_bin_button" class="btn btn-normal btn-default" onclick="onSearchRemote();" style="font-size: 14px; margin-right: 2px;">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                    <button class="btn btn-default pc-only btn-width" id="download_bin_button" onclick="downloadBin();"
                            style="font-size: 14px; margin-left: 2px; width: 120px;">
                        <i class="fa-solid fa-download" style="margin-right: 2px;"></i>
                        <span data-i18n="page_code.download_code">下载</span>
                    </button>
                    <button class="btn btn-default pc-only btn-width" id="decode_bin_button" onclick="onDecodeOnline();"
                            style="font-size: 14px; margin-left: 2px; width: 120px;">
                        <i class="fa-solid fa-rocket" style="margin-right: 2px;"></i>
                        <span data-i18n="page_code.decode_online">在线解码</span>
                    </button>
                </div>
            </div>
            <div id = "remote_table_container" style="width: 100%">
            </div>
        </div>
    </div>

    <!-- search dialog -->
    <div class="modal fade" id="search_dialog" role="dialog" aria-labelledby="myModalLabel"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                    <h4 class="modal-title" data-i18n="page_code.d_search_index_title">搜索编码</h4>
                </div>
                <div class="modal-body">
                    <div class="input-group" style="max-height: 25px;">
                        <span class="input-group-addon" data-i18n="page_code.d_search_index_map">编码映射</span>
                        <input type="text" class="form-control" placeholder="eg. upd6121g_box_041 or new_ac_11737" id="remote_map">
                    </div>
                    <br>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="searchRemote();" data-i18n="page_code.d_search_index_search">搜索</button>
                    <button type="button" class="btn btn-primary" data-dismiss="modal" data-i18n="page_code.d_search_index_cancel">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- hint dialog -->
    <div class="modal fade" id="hint_dialog" role="dialog" aria-labelledby="myModalLabel"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" aria-hidden="true" data-dismiss="modal">&times;</button>
                    <h4 class="modal-title" data-i18n="page_code.d_hint_title">提示</h4>
                </div>
                <div class="modal-body">
                    <div id="text_hint"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-dismiss="modal" data-i18n="page_code.d_hint_ok">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- decode dialog -->
    <div aria-hidden="true" aria-labelledby="myModalLabel" class="modal fade" id="decode_dialog" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button aria-hidden="true" class="close" data-dismiss="modal" type="button">&times;</button>
                    <h4 id="decode_online_title" class="modal-title" data-i18n="page_code.d_try_index_title">在线解码</h4>
                </div>
                <div class="modal-body">
                    <div id="decode_panel">
                        <div style="width: 100%;">
                            <div class="row">
                                <div class="col-lg-4" style="text-align: left; padding: 20px;">
                                    <div id="key_press_d" style="height: 20px;"></div>
                                    <hr>
                                    <div id="ac_status_power_d" style="height: 20px;"></div>
                                    <div id="ac_status_mode_d" style="height: 20px;"></div>
                                    <div id="ac_status_temp_d" style="height: 20px;"></div>
                                    <div id="ac_status_speed_d" style="height: 20px;"></div>
                                    <div id="ac_status_swing_d" style="height: 20px;"></div>
                                    <div id="ac_status_change_wind_dir_d" style="height: 20px;"></div>
                                </div>
                                <div class="col-lg-1">
                                </div>
                                <div class="col-lg-7" style="margin-left: 5px; text-align: left; border:1px solid #CFCFCF; padding: 20px;">
                                    <div class="row" style="text-align: left;">
                                        <div class="col-lg-2 col-md-offset-1" style="text-align: center;">
                                            <button class="cbtn btn btn-danger glyphicon glyphicon-off" id="pos_power" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-default glyphicon" id="pos_custom_0" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-default glyphicon" id="pos_custom_1" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-default glyphicon" id="pos_custom_2" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-primary glyphicon" id="pos_plus" name=""></button>
                                        </div>
                                    </div>
                                    <div class="row" style="text-align: center; margin-top: 20px;">
                                        <div class="col-lg-2 col-md-offset-1" style="text-align: center;">

                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">

                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-default glyphicon" id="pos_up" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">

                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">

                                        </div>
                                    </div>
                                    <div class="row" style="text-align: center; margin-top: 20px;">
                                        <div class="col-lg-2 col-md-offset-1" style="text-align: center;">

                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-default glyphicon" id="pos_left" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-primary glyphicon" id="pos_ok" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-default glyphicon" id="pos_right" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">

                                        </div>
                                    </div>
                                    <div class="row" style="text-align: center; margin-top: 20px;">
                                        <div class="col-lg-2 col-md-offset-1" style="text-align: center;">

                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">

                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-default glyphicon" id="pos_down" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">

                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-primary glyphicon" id="pos_minus" name=""></button>
                                        </div>
                                    </div>
                                    <div class="row" style="text-align: center; margin-top: 20px;">
                                        <div class="col-lg-2 col-md-offset-1" style="text-align: center;">

                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-default glyphicon" id="pos_custom_3" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-default glyphicon" id="pos_custom_4" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn btn-default glyphicon" id="pos_custom_5" name=""></button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">

                                        </div>
                                    </div>
                                    <div class="row stb_keys" style="text-align: center; margin-top: 20px;">
                                        <div class="col-lg-2 col-md-offset-1" style="text-align: center;">
                                            <button class="cbtn btn" id="pos_num_0" name="btn_14" style="width: 40px;">0</button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn" id="pos_num_1" name="btn_15" style="width: 40px;">1</button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn" id="pos_num_2" name="btn_16" style="width: 40px;">2</button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn" id="pos_num_3" name="btn_17" style="width: 40px;">3</button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn" id="pos_num_4" name="btn_18" style="width: 40px;">4</button>
                                        </div>
                                    </div>
                                    <div class="row stb_keys" style="text-align: center; margin-top: 20px;">
                                        <div class="col-lg-2 col-md-offset-1" style="text-align: center;">
                                            <button class="cbtn btn" id="pos_num_5" name="btn_19" style="width: 40px;">5</button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn" id="pos_num_6" name="btn_20" style="width: 40px;">6</button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn" id="pos_num_7" name="btn_21" style="width: 40px;">7</button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn" id="pos_num_8" name="btn_22" style="width: 40px;">8</button>
                                        </div>
                                        <div class="col-lg-2" style="text-align: center;">
                                            <button class="cbtn btn" id="pos_num_9" name="btn_23" style="width: 40px;">9</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div style="width: 100%;">
                                <div id="wave_container" style="height: 100px; margin-top: 10px; margin-bottom: 10px;"></div>
                                <pre id="ir_wave_value" readonly style="width: 100%; white-space: nowrap; text-align: left; overflow-x: scroll; color: #000;" data-i18n="[html]page_code.d_invoke_hint">
                                </pre>
                            </div>
                        </div>
                    </div>
                <div class="modal-footer">
                    <button class="btn btn-default" style="font-size: 14px;"
                            onclick="resetKeyPressInfo();" data-i18n="page_code.d_protocol_refresh">刷新
                    </button>
                    <button class="btn btn-default" data-i18n="page_code.d_try_index_quit"
                            onclick="quitDecode();" type="button">关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
